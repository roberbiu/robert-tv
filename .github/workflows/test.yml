name: Robert影视构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;30.0.3'
      - uses: gradle/actions/setup-gradle@v4
      - name: 验证并构建当前工程
        run: |
          chmod +x gradlew
          ./gradlew :app:testJavaDebugUnitTest :app:assembleJavaDebug --no-daemon --console=plain
      - name: 保存单 APK 测试包
        uses: actions/upload-artifact@v4
        with:
          name: RobertTV-debug
          path: app/build/outputs/apk/java/debug/*.apk
          if-no-files-found: error
          retention-days: 14
